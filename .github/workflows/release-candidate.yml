name: Build source-linked UCH candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate source
        run: |
          go run ./cmd/check-address-privacy
          go test ./... -timeout 60s
          go vet ./...
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build and record provenance
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          out="$RUNNER_TEMP/uch-candidate"
          mkdir -p "$out"
          go build -trimpath -buildvcs=true -o "$out/uch-server" ./cmd/uch-server
          go version -m "$out/uch-server" > "$out/BUILDINFO.txt"
          git rev-parse HEAD > "$out/SOURCE_REVISION.txt"
          (cd "$out" && sha256sum uch-server > SHA256SUMS)
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify embedded revision on the runner
        run: go run ./cmd/check-release "$RUNNER_TEMP/uch-candidate/uch-server" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/uch-candidate/provenance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: uch-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/uch-candidate/
