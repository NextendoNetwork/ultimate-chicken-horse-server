name: Go control plane checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -timeout 60s
      - run: go vet ./...
      - run: go build ./cmd/uch-server
